name: Continuous Integration & Deployment Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Frontend Quality & Build (Next.js 14 + Fluent UI v9)
  # -------------------------------------------------------------
  frontend-ci:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci || npm --prefix frontend install

      - name: Lint Frontend Code
        run: npm --prefix frontend run lint || true

      - name: Build Next.js Application
        run: npm --prefix frontend run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

  # -------------------------------------------------------------
  # Job 2: Backend Quality & Build (Node.js 20 + TypeScript)
  # -------------------------------------------------------------
  backend-ci:
    name: Backend Quality & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        run: npm --prefix backend ci || npm --prefix backend install

      - name: Lint Backend Code
        run: npm --prefix backend run lint || true

      - name: Compile Backend TypeScript
        run: npm --prefix backend run build
        env:
          NODE_ENV: production

  # -------------------------------------------------------------
  # Job 3: Security Vulnerability Scan (Trivy SAST & SCA)
  # -------------------------------------------------------------
  trivy-security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '0'

  # -------------------------------------------------------------
  # Job 4: Full-Stack E2E Integration (Docker Compose + Playwright)
  # -------------------------------------------------------------
  e2e-playwright:
    name: Full-Stack E2E Integration Tests
    needs: [ frontend-ci, backend-ci ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Setup Environment File
        run: cp .env.example .env

      - name: Build and Start Containers with Docker Compose
        run: docker compose up -d --build

      - name: Wait for Services Health (PostgreSQL, MinIO, Redis, Meilisearch, Backend, Frontend)
        run: |
          echo "Waiting for Backend API (http://localhost:5000/api/v1/health)..."
          for i in {1..30}; do
            if curl -s -f http://localhost:5000/api/v1/health > /dev/null; then
              echo "Backend is healthy!"
              break
            fi
            echo "Waiting for backend ($i/30)..."
            sleep 2
          done

          echo "Waiting for Frontend Web (http://localhost:3000)..."
          for i in {1..30}; do
            if curl -s -f http://localhost:3000 > /dev/null; then
              echo "Frontend is healthy!"
              break
            fi
            echo "Waiting for frontend ($i/30)..."
            sleep 2
          done

      - name: Install Root Dependencies (Playwright)
        run: npm ci || npm install

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Test Suite
        run: npx playwright test
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_API_URL: http://localhost:5000/api/v1

      - name: Upload Playwright Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Tear Down Docker Environment
        if: always()
        run: docker compose down -v
